# New OCR pipeline (Surya layout + dynamic routing + VlmClient)

hardware:
  gpu: "RTX 4070 Super"
  vram_gb: 12

layout:
  dpi: 200
  device: "cuda"
  # surya_v2 needs Docker+vLLM on Windows; code auto-falls back to full-page
  # force: surya | fullpage
  force_backend: ""

math:
  # mineru preferred when installed; auto-falls back to VlmClient
  engine: "mineru"
  # context-aware: body display $$ ; inline $ ; tabular cells $ only (never $$)
  formula_style: "context"
  # Enforce full LaTeX for ALL math (frac, powers, roots, greek, ...), not plain text
  force_latex: true

# Default VLM (T7): Qwen2.5-VL-7B-Instruct 4bit. GLM kept as optional adapter.
vlm:
  backend: "qwen"   # qwen | glm
  model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
  load_in_4bit: true
  max_new_tokens: 4096
  temperature: 0.1
  max_pixels: 1003520

# Legacy alias — prefer `vlm:` above. Kept so older scripts still load keys.
glm:
  model_name: "zai-org/GLM-4.6V-Flash"
  load_in_4bit: true
  max_new_tokens: 4096
  temperature: 0.1
  max_pixels: 1003520

paths:
  sources_dir: "data/sources"
  pages_dir: "data/pdf_pages"
  output_dir: "output"
  crop_dir: "output/crops"

pipeline:
  # false = faster: one Stage3 polish for whole document
  polish_per_page: false
  # skip figure/other blocks in routing
  skip_figures: true
