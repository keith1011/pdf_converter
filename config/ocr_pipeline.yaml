# New OCR pipeline (MinerU layout + Qwen2.5-VL text/formula)

hardware:
  gpu: "RTX 4070 Super"
  vram_gb: 12

layout:
  dpi: 200
  device: "cuda"
  # surya_v2 needs Docker+vLLM on Windows; code auto-falls back to full-page
  # force: surya | fullpage
  force_backend: ""

engines:
  # TRUNK LOCKED 2026-07-24 (user): MinerU layout + Qwen2.5-VL text + Qwen formula.
  # Specialty knives (got / unimernet) are formula-only experiments — never default text path.
  # Runtime: MinerU lives in `.venv-mineru312` (transformers 4.57); main `.venv` may lack mineru.
  layout: "mineru"    # mineru (trunk) | surya | doclayout_yolo
  text: "vlm"         # vlm (= Qwen) | ppocr
  formula: "vlm"      # vlm (= Qwen) | got | unimernet (specialty only)

math:
  # mineru preferred when installed; auto-falls back to VlmClient
  engine: "mineru"
  # context-aware: body display $$ ; inline $ ; tabular cells $ only (never $$)
  formula_style: "context"
  # Enforce full LaTeX for ALL math (frac, powers, roots, greek, ...) , not plain text
  force_latex: true

# Default VLM (T7): Qwen2.5-VL-7B-Instruct 4bit. GLM kept as optional adapter.
vlm:
  backend: "qwen"   # qwen | glm
  model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
  load_in_4bit: true
  # Stage3 polish (per page). 2048 is enough for typical exam pages; raise if truncated.
  max_new_tokens: 2048
  # Stage2 crop OCR (math/text/table). Crops are small — keep lower than polish.
  max_new_tokens_route: 1024
  temperature: 0.0
  max_pixels: 1003520

# Legacy alias — prefer `vlm:` above. Kept so older scripts still load keys.
glm:
  # Deprecated for experiments; clean cached weights with scripts/cleanup_glm_weights.ps1.
  model_name: "zai-org/GLM-4.6V-Flash"
  load_in_4bit: true
  max_new_tokens: 2048
  temperature: 0.0
  max_pixels: 1003520

paths:
  sources_dir: "data/sources"
  pages_dir: "data/pdf_pages"
  output_dir: "output"
  crop_dir: "output/crops"

pipeline:
  # Deprecated: content-first always polishes per page (kept for config compat)
  polish_per_page: false
  # Write draft text directly into content-first artifacts (no Stage3 VLM call).
  skip_polish: false
  # Optional artifact suffix, e.g. `123.got-ppocr.tex`.
  output_tag: ""
  # Do not OCR figures into the Stage2 draft stitch; crops are still kept for captioning.
  skip_figures: true
  # Write figures/*.png and Qwen captions into PageIR (ingest contract).
  extract_figures: true
  # Refuse a second concurrent run_ocr_pipeline (12GB VRAM)
  single_instance_lock: true
